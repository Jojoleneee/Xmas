<!doctype html>
<html lang="nl">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>De Grote Jolijn Kerstcadeauquiz</title>
        <style>
            :root {
                --red: #b52d35;
                --green: #173d32;
                --gold: #f4c95d;
                --card: #f6e3e3;
                --blue: #5b74b8;
            }
            body {
                margin: 0;
                font-family: Georgia, serif;
                background: linear-gradient(135deg, #12382f, #20523e);
                color: #222;
            }
            .snow {
                position: fixed;
                inset: 0;
                pointer-events: none;
            }
            .flake {
                position: absolute;
                color: #fff;
                animation: fall linear infinite;
            }
            @keyframes fall {
                to {
                    transform: translateY(110vh);
                }
            }
            .card {
                max-width: 1100px;
                margin: 20px auto;
                background: var(--card);
                padding: 28px;
                border: 8px ridge var(--gold);
                border-radius: 16px;
            }
            .hidden {
                display: none;
            }
            .btn,
            .choice {
                display: block;
                width: 100%;
                padding: 14px;
                margin: 8px 0;
                border-radius: 12px;
                border: 2px solid #c9b08a;
                background: #fff;
                cursor: pointer;
            }
            .btn {
                background: var(--red);
                color: #fff;
                font-weight: bold;
            }
            .choice.selected {
                background: #fde7b2;
                border-color: var(--red);
                box-shadow: 0 0 12px var(--gold);
            }
            .progress {
                height: 16px;
                background: #ddd;
                border-radius: 10px;
                overflow: hidden;
            }
            .progress span {
                display: block;
                height: 100%;
                background: var(--red);
                width: 0;
            }
            .results {
                background: var(--green);
                padding: 20px;
                border-radius: 14px;
                color: #fff;
            }
            .gift,
            .pack,
            .insp {
                padding: 15px;
                margin: 12px 0;
                border-radius: 12px;
                color: #222;
            }
            .gift {
                background: #fff;
                border-left: 8px solid var(--red);
            }
            .pack {
                background: #eef8f0;
                border-left: 8px solid #2f8a56;
            }
            .insp {
                background: #eef3ff;
                border-left: 8px solid var(--blue);
            }
        </style>
    </head>
    <body>
        <audio id="bgMusic" loop>
            <source src="nastelbom-we-wish-you-a-merry-christmas-452819.mp3" type="audio/mpeg" />
        </audio>
        <div id="snow" class="snow"></div>
        <div class="card">
            <div style="display: flex; justify-content: space-between">
                <b>Officieel goedgekeurd door de kerstelfen</b
                ><button id="musicBtn" class="btn" style="width: auto">♫ Muziek aan</button>
            </div>
            <h1>🎄 De Grote Jolijn Kerstcadeauquiz</h1>
            <div class="progress"><span id="bar"></span></div>
            <section id="s0">
                <p>Heb jij de eervolle taak gekregen om een cadeau voor Jolijn uit te zoeken?</p>
                <button class="btn" id="start">START DE MISSIE</button>
            </section>
            <section id="s1" class="hidden">
                <h2>Wat is Jolijn voor jou?</h2>
                <div id="rel">
                    <button class="choice">Dochter</button><button class="choice">Favoriete (schoon)zus</button
                    ><button class="choice">Favoriete tante</button><button class="choice">Anders</button>
                </div>
                <button class="btn" id="n1">Verder</button>
            </section>
            <section id="s2" class="hidden">
                <h2>Wat is je budget?</h2>
                <div id="bud">
                    <button class="choice">Tot €10</button><button class="choice">€10-25</button
                    ><button class="choice">€25-50</button><button class="choice">€50-100</button
                    ><button class="choice">Mijn liefde voor Jolijn kent geen prijskaartje</button>
                </div>
                <button class="btn" id="n2">Verder</button>
            </section>
            <section id="s3" class="hidden">
                <h2>Wat voor hulp wil je?</h2>
                <div id="mode">
                    <button class="choice">🎯 Vertel me wat ik moet kopen</button
                    ><button class="choice">✨ Ik wil inspiratie</button>
                </div>
                <button class="btn" id="n3">Cadeaumachine starten</button>
            </section>
            <section id="s4" class="hidden">
                <h2>🎁 Cadeaumachine</h2>
                <p id="mtext">De kerstelfen openen het dossier...</p>
                <div class="progress"><span id="load"></span></div>
                <p id="pct">0%</p>
            </section>
            <section id="s5" class="hidden">
                <div class="results">
                    <div id="out"></div>
                    <button class="btn" id="restart">🔄 Nieuwe Cadeaumissie</button>
                </div>
            </section>
        </div>
        <script>
            for (let i = 0; i < 100; i++) {
                let f = document.createElement("div");
                f.className = "flake";
                f.textContent = "❄";
                f.style.left = Math.random() * 100 + "%";
                f.style.fontSize = 8 + Math.random() * 18 + "px";
                f.style.animationDuration = 8 + Math.random() * 10 + "s";
                snow.appendChild(f);
            }
            const a = {};
            function page(n) {
                document.querySelectorAll("section").forEach((s) => s.classList.add("hidden"));
                document.getElementById("s" + n).classList.remove("hidden");
                document.getElementById("bar").style.width = (n / 5) * 100 + "%";
            }
            function bind(id, key) {
                document.querySelectorAll("#" + id + " .choice").forEach(
                    (b) =>
                        (b.onclick = () => {
                            document
                                .querySelectorAll("#" + id + " .choice")
                                .forEach((x) => x.classList.remove("selected"));
                            b.classList.add("selected");
                            a[key] = b.textContent;
                        })
                );
            }
            bind("rel", "r");
            bind("bud", "b");
            bind("mode", "m");
            document.getElementById("start").onclick = () => page(1);
            document.getElementById("n1").onclick = () => (a.r ? page(2) : alert("Kies een optie"));
            document.getElementById("n2").onclick = () => (a.b ? page(3) : alert("Kies een budget"));
            document.getElementById("n3").onclick = () => {
                if (!a.m) return alert("Kies een optie");
                page(4);
                let msgs = [
                    "De kerstelfen openen het dossier...",
                    "Budget wordt in glitter omgezet...",
                    "Beschikbare cadeaus worden bekeken...",
                    "Resultaten worden ingepakt...",
                ];
                let i = 0;
                let t = setInterval(() => {
                    mtext.textContent = msgs[i];
                    load.style.width = ((i + 1) / msgs.length) * 100 + "%";
                    pct.textContent = Math.round(((i + 1) / msgs.length) * 100) + "%";
                    i++;
                    if (i >= msgs.length) {
                        clearInterval(t);
                        setTimeout(showResults, 500);
                    }
                }, 800);
            };
            function showResults() {
                page(5);
                let h = "";
                if ((a.m || "").includes("inspiratie")) {
                    h +=
                        '<div class="insp"><h2>✨ Inspiratiecadeaus</h2><h3>Engelstalige fantasy boeken</h3><p>€10-25 | boekwinkels, bol, amazon</p><p>Suggesties: Hunger Games Collectors Edition, Six Scorched Roses, Remarkably Bright Creatures, Spells for Forgetting, The Fifth Season</p><p>🎄 Waarom de kerstelfen dit cadeau hebben gekozen: Omdat verdwalen in een goed verhaal soms het mooiste cadeau is.</p></div>';
                    h +=
                        '<div class="insp"><h3>Diamond Painting</h3><p>Prijs zelf te bepalen | bol, amazon, online winkels</p></div><div class="insp"><h3>Turtle Beach headset</h3><p>€30-100 | voorkeur paars, roze, wit</p></div><div class="insp"><h3>Lego van eigen inspiratie</h3></div><div class="insp"><h3>Puzzels</h3></div><div class="insp"><h3>Kleurboek</h3><p>Voorkeur Jade Summer</p></div>';
                } else {
                    const cards = [
                        [
                            "Ohuhu Honolulu 48 Mid Tone Colors Brush and Fine tip",
                            "€48",
                            "Amazon, Ohuhu",
                            "kortingscode PurposeColoring10",
                            "Omdat Jolijn nog nooit heeft gezegd: Ik heb eigenlijk te veel stiften.",
                        ],
                        [
                            "Cozy Romantasy kleurboek",
                            "€16",
                            "Bol, Pipoos, Bruna",
                            "",
                            "Fantasy, dekentjes en kleurpotloden zijn een bewezen wintercombinatie.",
                        ],
                        [
                            "Johanna Basford kleurboek",
                            "€15-20",
                            "Bol, Amazon, boekwinkel",
                            "Voorkeur Inklings of Small Victories",
                            "Creatieve ontspanning raakt nooit uit de mode.",
                        ],
                        [
                            "Ulster Weaver ovenwant",
                            "€10-20",
                            "Kookwinkels, Bol",
                            "Butterfly Grove of Pasta Lovers Club",
                            "Praktisch én leuk.",
                        ],
                        [
                            "Murdoku puzzelboek",
                            "€15-20",
                            "Boekwinkels, Bol",
                            "Murdoku of Alice is niet de moordenaar",
                            "Nog één puzzeltje...",
                        ],
                        [
                            "Lego boekensteun boekhandel",
                            "€100+",
                            "Lego, Bol",
                            "Check Brickwatch",
                            "Boeken worden nóg gezelliger met LEGO.",
                        ],
                        [
                            "Lego gezellige plantjes",
                            "€20",
                            "Lego, Bol",
                            "Check Brickwatch",
                            "Gezelligheid zonder water geven.",
                        ],
                    ];
                    h += "<h2>🎯 Concrete cadeaus</h2>";
                    cards.forEach(
                        (c) =>
                            (h += `<div class="gift"><h3>${c[0]}</h3><p>Prijs: ${c[1]}<br>Verkrijgbaar bij: ${c[2]}</p><p>${c[3]}</p><p>🎄 Waarom de kerstelfen dit cadeau hebben gekozen: ${c[4]}</p></div>`)
                    );
                }
                if ((a.b || "").includes("50-100") || (a.b || "").includes("prijskaartje")) {
                    h +=
                        '<h2>🎁 Cadeaupakketten</h2><div class="pack"><h3>Hobby verzamelaar</h3><ul><li>Kleurboek</h3><p>Voorkeur Jade Summer of Coco Wyo</li><li>Diamond Painting</h3><p>Prijs zelf te bepalen | bol, amazon, online winkels</li><li>Engelstalige fantasy boeken</h3><p>€10-25 | boekwinkels, bol, amazon</p><p>Suggesties: Hunger Games Collectors Edition, Six Scorched Roses, Remarkably Bright Creatures, Spells for Forgetting, The Fifth Season</li></ul></div><div class="pack"><h3>Cozy kleuren</h3><ul><li>Ohuhu Honolulu 48 Mid Tone Colors Brush and Fine tip</h3><p>€48 | Amazon, Ohuhu | kortingscode PurposeColoring10</li><li>Kleurboek</h3><p>Voorkeur Jade Summer of Coco Wyo</li></ul></div><div class="pack"><h3>Variatieset</h3><ul><li>Ulster Weaver ovenwant</h3><p>€10-20 | Kookwinkels, Bol | Butterfly Grove of Pasta Lovers Club</li><li>Turtle Beach headset</h3><p>€30-100 | voorkeur paars, roze, wit</li><li>Kleurboek</h3><p>Voorkeur Jade Summer of Coco Wyo</li></ul></div><div class="pack"><h3>Puzzelmoment</h3><ul><li>Puzzel</li><li>Lego</li><li>Murdoku</h3><p>€15-20 | Boekwinkels, Bol | Murdoku of Alice is niet de moordenaar</li></ul></div>';
                }
                document.getElementById("out").innerHTML = h;
            }
            document.getElementById("restart").onclick = () => location.reload();
            document.getElementById("musicBtn").onclick = async () => {
                const bg = document.getElementById("bgMusic");
                try {
                    if (bg.paused) {
                        await bg.play();
                        musicBtn.textContent = "♫ Muziek uit";
                    } else {
                        bg.pause();
                        musicBtn.textContent = "♫ Muziek aan";
                    }
                } catch (e) {
                    alert("Zet de mp3 in dezelfde map als deze HTML.");
                }
            };
        </script>
    </body>
</html>
